name: Victus native compile checks
on:
  pull_request:
    paths: ['mobile/**', 'src/lib/victus*', 'src/app/api/victus/**', 'src/app/api/cron/victus/**', 'supabase/**', '.github/workflows/victus-native.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Verify private tables and dispatch claims
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/victus_live_setup.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/0015_victus_live_consent.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/victus_live.sql
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - run: npm install --install-links
        working-directory: mobile
      - run: npm run android:prepare
        working-directory: mobile
      - run: bash gradlew assembleDebug --no-daemon
        working-directory: mobile/android
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare unsigned simulator build
        working-directory: mobile
        run: |
          export GEM_HOME="$RUNNER_TEMP/victus-gems"
          export GEM_PATH="$GEM_HOME"
          gem install xcodeproj --no-document
          npm install --install-links
          sh scripts/prepare-ios.sh
      - name: Compile app and widget without signing or publishing
        working-directory: mobile
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
