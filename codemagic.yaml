# Codemagic — compila a app iOS (pasta mobile/) e envia para o TestFlight.
# Antes do primeiro build (ver mobile/README.md):
#  1. App Store Connect → Users and Access → Integrations → criar chave de API (acesso "App Manager").
#  2. Codemagic → Team settings → Integrations → Developer Portal → adicionar a chave com o nome "takingcare-asc".
#  3. Apple Developer → Identifiers → com.zamoriane.takingcare com a capacidade HealthKit ativa.
#  4. App Store Connect → criar a app com esse identificador e pôr o "Apple ID" dela em APP_STORE_APPLE_ID.
workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: mobile
    integrations:
      app_store_connect: takingcare-asc
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: "com.zamoriane.takingcare*" # App + VictusWidget extension
      vars:
        APP_STORE_APPLE_ID: "6822895921" # Apple ID da app no App Store Connect
        MARKETING_VERSION: "1.0.0"
      node: 22
      xcode: latest
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "ios-v*"
    scripts:
      - name: Instalar dependências
        script: npm install
      - name: Preparar projeto iOS (Capacitor, ícones, Saúde)
        script: sh scripts/prepare-ios.sh
      - name: Assinatura
        script: xcode-project use-profiles
      - name: Versão e número do build
        script: |
          cd ios/App
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          agvtool new-marketing-version "$MARKETING_VERSION"
          agvtool new-version -all $((LATEST + 1))
      - name: Compilar .ipa
        script: xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
